name: Build and Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and package only: no GitHub release, no Nexus upload'
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    uses: AlienXAXS/StarRupture-Plugin-SDK/.github/workflows/plugin-release.yml@v1.23.0
    with:
      plugin_name: WaveOptimiser
      solution_file: WaveOptimiser_Plugin.sln
      dll_name: WaveOptimiser_Plugin
      release_title: WaveOptimiser Plugin
      server_build: true
      # Global (v3 API) id of the mod page: GET /v3/games/starrupture/mods/130 -> data.id
      nexus_mod_id: '37074157699202'
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
